<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f7efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Glow ניהול">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>ניהול תורים · Glow House</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7efe6;--card:#fffaf4;--ink:#2e2218;--mu:#8a7868;--ln:#eadccd;--ac:#a8743f;--ac-d:#7d5227;--soft:#f1e3d2;--ok:#3f7d55;--bad:#b2452f;--warn:#b7791f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 14px calc(110px + env(safe-area-inset-bottom))}
header{padding:22px 4px 10px}
header b{font-family:"Frank Ruhl Libre",serif;font-size:26px;color:var(--ac-d)}
header span{display:block;color:var(--mu);font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px -14px 14px;padding:0 14px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:4;padding-block:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:inherit;font-weight:700;font-size:14px;border:1.5px solid var(--ln);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;cursor:pointer}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.card{background:var(--card);border:1.5px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 4px}
.card p.h{color:var(--mu);font-size:13px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln);flex-wrap:wrap}
.row:first-of-type{border-top:0}
.row .g{flex:1;min-width:0}
.row .g b{display:block}
.row .g small{color:var(--mu);display:block}
input,select{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--ln);border-radius:10px;padding:9px 10px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--ac)}
input[type=time]{width:112px}input[type=number]{width:84px}input[type=date]{width:150px}
input.w{width:100%}
label.f{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:#d8c9b8;transition:background .15s}
.sw i:after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:after{transform:translateX(-20px)}
.btn{appearance:none;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer;background:var(--ac);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.full{width:100%;font-size:17px}.btn.ghost{background:var(--soft);color:var(--ink)}.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.del{background:none;color:var(--bad);padding:6px 8px;font-size:14px}
.btn[disabled]{opacity:.5}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
.pill.ok{background:#dcefe2;color:var(--ok)}.pill.bad{background:#fbe9e4;color:var(--bad)}.pill.warn{background:#fbf0d9;color:var(--warn)}
.box{border-radius:12px;padding:12px 14px;font-size:14px;margin:10px 0}
.box.bad{background:#fbe9e4;color:#7a2a1a}.box.ok{background:#dcefe2;color:#234d33}.box.warn{background:#fbf0d9;color:#6b4710}
.box ol{margin:6px 0 0;padding-inline-start:20px}
.bar{position:fixed;inset:auto 0 0 0;background:rgba(247,239,230,.95);backdrop-filter:blur(10px);border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:612px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar small{color:var(--mu);flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.day{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--ac);margin:14px 2px 2px}
.muted{color:var(--mu);font-size:14px}
.center{text-align:center;padding:60px 16px}
.cx{text-decoration:line-through;color:var(--mu)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header><b>Glow House</b><span>ניהול זימון התורים</span></header>
<div id="app"><div class="center muted">טוען…</div></div>
</div>
<div class="bar" id="bar" hidden><div class="in"><small id="dirty"></small><button class="btn" id="save">שמירה</button></div></div>
<script>
const FN='https://tcnnmbmooynevstasgaj.supabase.co/functions/v1/glow-booking';
const KEY='sb_publishable_qOxby8FAtaYFziBdLXIuUg_WB5Kp7lQ';
// the secret key arrives once in the link (#k=...), is kept on this device, and is removed from the address bar
let T='';try{const m=/[#&]k=([a-f0-9]{32,})/.exec(location.hash);if(m)localStorage.setItem('glow_admin',m[1]);T=(m&&m[1])||localStorage.getItem('glow_admin')||''}catch(e){}
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
// Android/desktop install uses the manifest (storage is shared with the browser there). On iPhone the home-screen
// icon keeps the exact link it was added from, which carries the key, so no manifest is linked there.
if(!IOS){const ml=document.createElement('link');ml.rel='manifest';ml.href='admin.webmanifest';document.head.appendChild(ml)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
let installEvt=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(D)render()});
(()=>{const q=new URLSearchParams(location.search);if(q.get('google')){history.replaceState(null,'',location.pathname+location.hash);window.__gOk=q.get('google')==='ok'}})();
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
async function call(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,'x-admin-token':T},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'server');return j}
let D=null,V=null,tab='today',dirty=false;
const uid=()=>Math.random().toString(36).slice(2,10);
function mark(){dirty=true;$('#bar').hidden=false;$('#dirty').textContent='יש שינויים שלא נשמרו'}
const fmtD=d=>{const [y,m,dd]=d.split('-');return `${+dd}.${+m}.${y.slice(2)}`};
const todayStr=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Jerusalem'});

function render(){
  const c=D.calendar, live=V.live;
  let h=`<div class="tabs">${[['today','תורים'],['hours','שעות עבודה'],['blocks','חסימות'],['svc','טיפולים'],['more','הגדרות']].map(([k,n])=>`<button class="tab ${tab===k?'on':''}" data-tab="${k}">${n}</button>`).join('')}</div>`;
  if(tab==='today'){
    if(window.__gOk!==undefined){h+=window.__gOk?'<div class="box ok">החיבור לגוגל הצליח ✓</div>':'<div class="box bad">החיבור לגוגל לא הושלם. נסי שוב.</div>';window.__gOk=undefined}
    {const t=todayStr(), tm=new Date(Date.parse(t+'T12:00:00Z')+86400e3).toISOString().slice(0,10);
     const due=[];
     for(const b of D.bookings||[]){ if(b.status!=='confirmed'||new Date(b.starts_at)<new Date())continue; const d=new Date(b.starts_at).toLocaleDateString('sv-SE',{timeZone:'Asia/Jerusalem'}); const R=b.reminders||{};
       if(d===tm&&!R.r24_wa)due.push([b,'r24']); else if(d===t&&!R.morning_wa)due.push([b,'morning']); }
     if(due.length){ h+=`<div class="card" id="rem" style="border:1.5px solid var(--ac)"><h2>📲 תזכורות לשלוח (${due.length})</h2><p class="h">לחיצה פותחת את הווצאפ שלך עם ההודעה מוכנה, רק לשלוח.</p>${due.map(([b,k])=>{const tm2=new Date(b.starts_at).toLocaleTimeString('he-IL',{timeZone:'Asia/Jerusalem',hour:'2-digit',minute:'2-digit'});return `<div class="row"><div class="g"><b>${esc(b.name)} · ${tm2}</b><small>${k==='r24'?'מחר':'היום'} · ${esc(b.service_name)}${b.attend_confirmed_at?' · אישרה הגעה':''}</small></div><button class="btn sm" data-wa="${b.id}" data-k="${k}">שליחה בווצאפ</button></div>`}).join('')}</div>`; }}
    {const perm=('Notification' in window)?Notification.permission:'na', has=D.admin_push_count>0;
     h+=`<div class="card"><h2>🔔 התראות לטלפון</h2>${has&&perm==='granted'?'<p class="h" style="margin:0">פעיל ✓ תקבלי התראה על כל תור חדש, ביטול ואישור הגעה.</p>':IOS&&!STANDALONE?'<p class="h" style="margin:0">באייפון התראות עובדות רק מהאפליקציה: קודם מתקינים (למטה), פותחים מהאייקון, ואז מפעילים כאן.</p>':`<p class="h">תורים חדשים, ביטולים ואישורי הגעה יקפצו לך בטלפון.</p><button class="btn full" id="apush">הפעלת התראות</button>`}</div>`;}
    if(!STANDALONE) h+=`<div class="card"><h2>📲 להתקין כאפליקציה בטלפון</h2>${installEvt?'<p class="h">אייקון של Glow ניהול יופיע במסך הבית.</p><button class="btn full" id="inst">התקנה</button>':IOS?'<p class="h" style="margin:0">בספארי: כפתור השיתוף <b>⬆︎</b> למטה ← <b>"הוספה למסך הבית"</b> ← "הוספה". חשוב לפתוח מהקישור שקיבלת, כדי שהאייקון יזכור את הכניסה.</p>':'<p class="h" style="margin:0">בכרום: תפריט שלוש הנקודות ← <b>"התקנת אפליקציה"</b> או "הוספה למסך הבית".</p>'}</div>`;
    h+=`<div class="card"><div class="row"><div class="g"><b>קביעת תורים אונליין</b><small>${live?'פתוח. לקוחות יכולות לקבוע תור מהקישור.':'סגור. הלקוחות רואות "ייפתח בקרוב".'}</small></div><label class="sw"><input type="checkbox" id="live" ${live?'checked':''} ${!c.ok||!c.write?'disabled':''}><i></i></label></div>`;
    if(!c.ok||!c.write) h+=`<div class="box ${c.ok?'warn':'bad'}"><b>${c.ok?'היומן מחובר לקריאה בלבד':'היומן עוד לא מחובר'}</b>, ולכן אי אפשר לפתוח את הקביעה.
      <p style="margin:8px 0">לוחצים על הכפתור, בוחרים את החשבון <b dir="ltr">${esc(V.calendar_id)}</b> ומאשרים. זה הכול.</p>
      <button class="btn full" id="gconn">📅 חיבור היומן עם Google</button>
      <p class="muted" style="font-size:13px;margin:8px 0 0">אם גוגל מציג "האפליקציה לא אומתה": לוחצים "מתקדם" ← "מעבר אל Karin OS". זו המערכת של קרין.</p>
      ${D.share_with?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px">דרך אחרת: שיתוף היומן עם קרין</summary><ol style="font-size:13px"><li>calendar.google.com בדפדפן (בטלפון: תפריט הדפדפן ← "גרסה למחשב")</li><li>שלוש נקודות ליד היומן ← "הגדרות ושיתוף"</li><li>"שיתוף עם אנשים ספציפיים" ← <b dir="ltr">${esc(D.share_with)}</b></li><li>הרשאה: <b>"ביצוע שינויים באירועים"</b></li></ol></details>`:''}
      <button class="btn sm ghost" id="recheck" style="margin-top:8px">בדיקה מחדש</button></div>`;
    else h+=`<div class="box ok">היומן מחובר ✓ ${c.own&&c.email?'(<span dir="ltr">'+esc(c.email)+'</span>) ':''}כל מה שתפוס ביומן שלך נחסם אוטומטית לקביעה, ותורים חדשים נכנסים אליו מיד.${c.own?' <button class="link" id="gdis" style="font-size:13px">ניתוק</button>':''}</div>`;
    h+=`<div class="row"><div class="g"><b>הקישור ללקוחות</b><small dir="ltr" style="text-align:right;word-break:break-all">${esc(D.page)}</small></div><button class="btn sm ghost" id="copy">העתקה</button><a class="btn sm ghost" href="${esc(D.page)}?preview=1" target="_blank">תצוגה מקדימה</a></div>
    <div class="row"><div class="g"><b>התראות על תור חדש</b><small>${D.admin_push_count>0?'בהתראה לטלפון שלך':V.notify_email?'במייל ל-'+esc(V.notify_email)+' (עד שתפעילי התראות לטלפון)':'לא מוגדר'}</small></div></div></div>`;
    const up=D.bookings.filter(b=>new Date(b.ends_at)>new Date(Date.now()-3600e3));
    h+=`<div class="card"><h2>תורים שנקבעו אונליין</h2><p class="h">רק תורים שנקבעו דרך הקישור. את כל היומן רואים ביומן גוגל.</p>`;
    if(!up.length) h+=`<div class="muted">עוד אין תורים.</div>`;
    let last='';
    for(const b of up){ const d=new Date(b.starts_at).toLocaleDateString('sv-SE',{timeZone:'Asia/Jerusalem'}); if(d!==last){last=d;h+=`<div class="day">${d===todayStr()?'היום · ':''}יום ${DAYS[new Date(d+'T12:00:00Z').getUTCDay()]} ${fmtD(d)}</div>`}
      const tm=new Date(b.starts_at).toLocaleTimeString('he-IL',{timeZone:'Asia/Jerusalem',hour:'2-digit',minute:'2-digit'}), x=b.status!=='confirmed';
      h+=`<div class="row"><div class="g ${x?'cx':''}"><b>${tm} · ${esc(b.name)}</b><small>${esc(b.service_name)} · ${b.duration_min} דק׳ · <a href="tel:${esc(b.phone)}" dir="ltr">${esc(b.phone)}</a>${b.deposit?` · מקדמה ${b.deposit.amount} ₪ ב${b.deposit.method==='bit'?'ביט':'פייבוקס'} ${b.deposit.status==='received'?'<span class="pill ok">התקבלה</span>':b.deposit.status==='missing'?'<span class="pill bad">לא התקבלה</span>':'<span class="pill warn">לבדוק</span>'}`:''}</small>${!x?`<br><small>${b.attend_confirmed_at?'<span class="pill ok">אישרה הגעה</span>':'<span class="pill warn">לא אישרה עדיין</span>'} ${b.reminders&&b.reminders.r24&&b.reminders.r24!=='failed'?'· תזכורת יום לפני נשלחה':''}${b.reminders&&b.reminders.morning&&b.reminders.morning!=='failed'?' · תזכורת בוקר נשלחה':''}</small>`:''}${x&&b.deposit&&b.deposit.kept?' <span class="pill warn">ביטול מאוחר — המקדמה נשמרת</span>':''}${!x&&b.deposit&&b.deposit.status==='claimed'?`<span style="display:flex;gap:6px;margin-top:6px"><button class="btn sm ghost" data-dep="${b.id}" data-st="received">✓ המקדמה התקבלה</button><button class="btn sm ghost" data-dep="${b.id}" data-st="missing">✗ לא התקבלה</button></span>`:''}</div>${x?`<span class="pill bad">בוטל${b.cancelled_by==='client'?' ע״י הלקוחה':b.cancelled_by==='calendar'?' (נמחק מהיומן)':''}</span>`:`<button class="btn del" data-cancel="${b.id}">ביטול</button>`}</div>` }
    h+=`</div>`;
  }
  if(tab==='hours'){
    h+=`<div class="card"><h2>שעות עבודה</h2><p class="h">בשעות האלה לקוחות יכולות לקבוע. מה שתפוס ביומן שלך נחסם ממילא.</p>${DAYS.map((n,d)=>{const x=V.hours[d];return `<div class="row"><label class="sw"><input type="checkbox" data-h="${d}" data-k="on" ${x.on?'checked':''}><i></i></label><div class="g"><b>${n}</b></div><span ${x.on?'':'hidden'}><input type="time" data-h="${d}" data-k="from" value="${x.from}" aria-label="משעה"> עד <input type="time" data-h="${d}" data-k="to" value="${x.to}" aria-label="עד שעה"></span><span class="muted" ${x.on?'hidden':''}>סגור</span></div>`}).join('')}</div>
    <div class="card"><h2>הפסקה קבועה</h2><p class="h">שעות שחסומות כל שבוע, למשל הפסקת צהריים.</p>${V.weekly.map(b=>`<div class="row"><div class="g"><b>יום ${DAYS[b.wd]} · ${b.from}–${b.to}</b><small>${esc(b.note)}</small></div><button class="btn del" data-delw="${b.id}">מחיקה</button></div>`).join('')||'<div class="muted">אין הפסקות קבועות.</div>'}
    <div class="row"><select id="w_wd">${DAYS.map((n,i)=>`<option value="${i}">${n}</option>`).join('')}</select><input type="time" id="w_f" value="13:00"> עד <input type="time" id="w_t" value="14:00"><button class="btn sm" id="w_add">הוספה</button></div></div>`;
  }
  if(tab==='blocks'){
    const t=todayStr(), list=V.blocks.filter(b=>b.to_date>=t).sort((a,b)=>a.from_date.localeCompare(b.from_date));
    h+=`<div class="card"><h2>חסימה חדשה</h2><p class="h">חופשה, חג, או כמה שעות שאת לא זמינה. אפשר גם פשוט ליצור אירוע ביומן גוגל וזה ייחסם לבד.</p>
    <div class="grid2"><div><label class="f">מתאריך</label><input type="date" class="w" id="b_fd" min="${t}" value="${t}"></div><div><label class="f">עד תאריך</label><input type="date" class="w" id="b_td" min="${t}" value="${t}"></div></div>
    <div class="row"><div class="g"><b>כל היום</b></div><label class="sw"><input type="checkbox" id="b_all" checked><i></i></label></div>
    <div id="b_hrs" hidden class="row"><input type="time" id="b_f" value="09:00"> עד <input type="time" id="b_t" value="13:00"></div>
    <label class="f">הערה (רק בשבילך)</label><input type="text" class="w" id="b_n" maxlength="80" placeholder="למשל: חופשה באילת">
    <button class="btn full" id="b_add" style="margin-top:12px">הוספת חסימה</button></div>
    <div class="card"><h2>חסימות קרובות</h2>${list.map(b=>`<div class="row"><div class="g"><b>${fmtD(b.from_date)}${b.to_date!==b.from_date?' – '+fmtD(b.to_date):''} · ${b.all_day?'כל היום':b.from+'–'+b.to}</b><small>${esc(b.note)}</small></div><button class="btn del" data-delb="${b.id}">מחיקה</button></div>`).join('')||'<div class="muted">אין חסימות.</div>'}</div>`;
  }
  if(tab==='svc'){
    h+=`<div class="card"><h2>טיפולים</h2><p class="h">משך הטיפול קובע כמה זמן נחסם ביומן. טיפול כבוי לא מוצג ללקוחות.</p>${V.services.map((s,i)=>`<div class="row"><label class="sw"><input type="checkbox" data-s="${i}" data-k="on" ${s.on?'checked':''}><i></i></label><div class="g"><input type="text" class="w" data-s="${i}" data-k="name" value="${esc(s.name)}" maxlength="60" aria-label="שם הטיפול"><small>${esc(s.cat)}</small></div><span><input type="number" data-s="${i}" data-k="min" value="${s.min}" min="5" max="600" step="5" aria-label="דקות"> דק׳</span><span><input type="number" data-s="${i}" data-k="price" value="${s.price??''}" min="0" aria-label="מחיר"> ₪</span>${V.deposit_on?`<span style="font-size:13px">מקדמה <input type="number" data-s="${i}" data-k="deposit" value="${s.deposit??''}" min="0" placeholder="${V.deposit_amount||0}" aria-label="מקדמה לטיפול"> ₪</span>`:''}</div>`).join('')}
    <div class="row"><div class="g"><b>להציג מחירים ללקוחות</b></div><label class="sw"><input type="checkbox" data-v="show_prices" ${V.show_prices?'checked':''}><i></i></label></div>
    <button class="btn ghost full" id="s_add" style="margin-top:10px">+ טיפול חדש</button></div>`;
  }
  if(tab==='more'){
    const num=(k,l,sfx,min,max)=>`<div class="row"><div class="g"><b>${l}</b></div><span><input type="number" data-v="${k}" value="${V[k]}" min="${min}" max="${max}"> ${sfx}</span></div>`;
    h+=`<div class="card"><h2>תקנון ללקוחות</h2><p class="h">הלקוחה חייבת לסמן שקראה ומסכימה לתקנון לפני שהתור נקבע. <b>{deposit}</b> ו-<b>{cancel_hours}</b> מתחלפים לבד בסכום המקדמה ובשעות הביטול.</p><textarea class="w" data-v="terms" rows="14" style="font:inherit;font-size:14px;line-height:1.6;border:1.5px solid var(--ln);border-radius:10px;padding:10px;width:100%">${esc(V.terms||'')}</textarea></div>
    <div class="card"><h2>מקדמה לפני קביעת תור</h2><p class="h">הלקוחה מעבירה מקדמה בביט או בפייבוקס ומסמנת "העברתי", ורק אז התור נקבע. אצלך התור מסומן "לבדוק" עד שתאשרי שהכסף נכנס.</p>
    <div class="row"><div class="g"><b>לבקש מקדמה</b></div><label class="sw"><input type="checkbox" data-v="deposit_on" ${V.deposit_on?'checked':''}><i></i></label></div>
    ${num('deposit_amount','סכום המקדמה (לכל טיפול)','₪',0,5000)}
    <label class="f">קישור תשלום בביט (מומלץ — פותח את ביט ישר עם הסכום)</label><input type="url" class="w" dir="ltr" data-v="bit_url" value="${esc(V.bit_url||'')}" placeholder="קישור תשלום ממורנינג">
    <p class="h" style="margin:6px 0 0">יוצרים במורנינג ← קידום מכירות ← לינקים לתשלום, עם סכום המקדמה ותשלום בביט, ומדביקים כאן. בלי קישור, הלקוחה מעתיקה את המספר שלמטה ומעבירה בעצמה.</p>
    <label class="f">מספר לביט (אם אין קישור)</label><input type="tel" class="w" dir="ltr" data-v="bit_phone" value="${esc(V.bit_phone||'')}" placeholder="0501234567">
    <label class="f">קישור תשלום בפייבוקס (לא חובה)</label><input type="url" class="w" dir="ltr" data-v="paybox_url" value="${esc(V.paybox_url||'')}" placeholder="https://payboxapp.page.link/...">
    <p class="h" style="margin-top:8px">אפשר לקבוע מקדמה אחרת לטיפול מסוים בלשונית "טיפולים".</p></div>
    <div class="card"><h2>תזכורות ללקוחות</h2><p class="h">נשלחות לבד כהתראה לטלפון של לקוחה שאישרה התראות. בנוסף, כל בוקר מופיעה לך רשימת "תזכורות לשלוח" עם כפתור ווצאפ לכל לקוחה, כדי שגם מי שבאייפון תקבל תזכורת.</p>
    <div class="row"><div class="g"><b>יום לפני התור</b><small>כולל בקשה לאשר הגעה</small></div><label class="sw"><input type="checkbox" data-v="remind_24" ${V.remind_24!==false?'checked':''}><i></i></label></div>
    <div class="row"><div class="g"><b>בבוקר של התור</b></div><label class="sw"><input type="checkbox" data-v="remind_morning" ${V.remind_morning!==false?'checked':''}><i></i></label></div>
    ${num('morning_hour','שעת תזכורת הבוקר','',5,12)}</div>
    `+`<div class="card"><h2>כללי קביעה</h2>
    <div class="row"><div class="g"><b>שעות התחלה כל</b></div><span><select data-v="step_min">${[10,15,20,30,60].map(n=>`<option ${V.step_min===n?'selected':''}>${n}</option>`).join('')}</select> דק׳</span></div>
    ${num('buffer_min','הפסקה בין תורים','דק׳',0,60)}${num('lead_min','התראה מינימלית לפני תור','דק׳',0,10080)}${num('horizon_days','כמה ימים קדימה אפשר לקבוע','ימים',1,90)}${num('cancel_hours','ביטול אונליין עד','שעות לפני',0,168)}${num('max_per_phone','מקסימום תורים עתידיים ללקוחה','',1,10)}</div>
    <div class="card"><h2>פרטי העסק</h2><label class="f">שם שמוצג ללקוחות</label><input type="text" class="w" data-v="business" value="${esc(V.business)}" maxlength="80"><label class="f">כתובת</label><input type="text" class="w" data-v="address" value="${esc(V.address)}" maxlength="120">
    <label class="f">מספר ווצאפ של הקליניקה (לכפתור "הודעה בווצאפ" בדף)</label><input type="tel" class="w" dir="ltr" data-v="whatsapp" value="${esc(V.whatsapp)}" placeholder="0501234567">
    <label class="f">הנייד שלך לקבלת התראות ווצאפ</label><input type="tel" class="w" dir="ltr" data-v="notify_phone" value="${esc(V.notify_phone)}" placeholder="0501234567"></div>`;
  }
  app.innerHTML=h; bind();
}
function bind(){
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});
  app.querySelectorAll('[data-h]').forEach(i=>i.onchange=()=>{const x=V.hours[i.dataset.h];x[i.dataset.k]=i.type==='checkbox'?i.checked:i.value;mark();if(i.type==='checkbox')render()});
  app.querySelectorAll('[data-s]').forEach(i=>i.onchange=()=>{const x=V.services[i.dataset.s],k=i.dataset.k;x[k]=i.type==='checkbox'?i.checked:i.type==='number'?(i.value===''?null:+i.value):i.value;mark()});
  app.querySelectorAll('[data-v]').forEach(i=>i.onchange=()=>{const k=i.dataset.v;V[k]=i.type==='checkbox'?i.checked:(i.type==='number'||i.tagName==='SELECT')?+i.value:i.value;mark()});
  app.querySelectorAll('[data-delb]').forEach(b=>b.onclick=()=>{V.blocks=V.blocks.filter(x=>x.id!==b.dataset.delb);mark();render()});
  app.querySelectorAll('[data-delw]').forEach(b=>b.onclick=()=>{V.weekly=V.weekly.filter(x=>x.id!==b.dataset.delw);mark();render()});
  app.querySelectorAll('[data-dep]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await call({mode:'admin_deposit',id:b.dataset.dep,status:b.dataset.st});await load(true)}catch(e){alertBox('העדכון נכשל. נסי שוב.')}});
  app.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='בטוחה? לחצי שוב';return}b.disabled=true;try{await call({mode:'admin_cancel',id:b.dataset.cancel});await load(true)}catch(e){alertBox('הביטול נכשל. נסי שוב.')}});
  const on=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
  const live=$('#live'); if(live) live.onchange=async()=>{V.live=live.checked;await save()};
  on('recheck',()=>load(true));
  app.querySelectorAll('[data-wa]').forEach(btn=>btn.onclick=async()=>{
    const b=(D.bookings||[]).find(x=>x.id===btn.dataset.wa); if(!b)return; const k=btn.dataset.k;
    const tm=new Date(b.starts_at).toLocaleTimeString('he-IL',{timeZone:'Asia/Jerusalem',hour:'2-digit',minute:'2-digit'});
    const link=`https://glow.goldchain-ai.com/?c=${b.cancel_token}`, addr=V.address?`\n📍 ${V.address}`:'';
    const txt=k==='r24'
      ?`היי ${b.name} 💗\nתזכורת: מחר בשעה ${tm} — ${b.service_name} ב-${V.business}.${addr}\n\nנא לאשר הגעה כאן:\n${link}\n\nאפשר לבטל עד ${V.cancel_hours} שעות לפני התור מאותו קישור.${b.deposit?' אחרי זה המקדמה לא מוחזרת.':''}`
      :`בוקר טוב ${b.name} ☀️\nמחכה לך היום בשעה ${tm} — ${b.service_name}.${addr}${b.attend_confirmed_at?'':`\n\nלאישור הגעה: ${link}`}`;
    const ph=String(b.phone||'').replace(/\D/g,'').replace(/^0/,'972');
    window.open(`https://wa.me/${ph}?text=${encodeURIComponent(txt)}`,'_blank');
    btn.disabled=true;btn.textContent='נשלח ✓';
    try{await call({mode:'admin_reminded',id:b.id,kind:k});setTimeout(()=>load(true),1500)}catch(e){}
  });
  on('apush',async()=>{const b=$('#apush');b.disabled=true;b.textContent='רגע…';
    try{if(!('PushManager' in window))throw 0;if(await Notification.requestPermission()!=='granted'){alertBox('ההתראות לא אושרו. אפשר לאשר בהגדרות ולנסות שוב.');b.disabled=false;b.textContent='הפעלת התראות';return}
      const reg=await navigator.serviceWorker.ready;const u=s=>{const q='='.repeat((4-s.length%4)%4);const r=atob((s+q).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
      const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u(D.vapid)});
      await call({mode:'admin_push',sub:sub.toJSON()});await load(true)}
    catch(e){alertBox('לא הצלחתי להפעיל התראות במכשיר הזה.');b.disabled=false;b.textContent='הפעלת התראות'}});
  on('gconn',async()=>{const b=$('#gconn');b.disabled=true;b.textContent='פותח את גוגל…';try{const j=await call({mode:'admin_google_url'});location.href=j.url}catch(e){b.disabled=false;b.textContent='📅 חיבור היומן עם Google';alertBox('לא הצלחתי לפתוח את גוגל. נסי שוב.')}});
  on('gdis',async()=>{const b=$('#gdis');if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='בטוחה? לחצי שוב';return}try{await call({mode:'admin_google_disconnect'});await load(true)}catch(e){alertBox('הניתוק נכשל')}});
  on('inst',async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;render()});
  on('copy',async()=>{try{await navigator.clipboard.writeText(D.page);$('#copy').textContent='הועתק ✓'}catch(e){}});
  const all=$('#b_all'); if(all) all.onchange=()=>{$('#b_hrs').hidden=all.checked};
  on('b_add',()=>{const fd=$('#b_fd').value,td=$('#b_td').value||fd;if(!fd)return;const a=$('#b_all').checked;V.blocks.push({id:uid(),from_date:fd,to_date:td<fd?fd:td,all_day:a,from:a?'':$('#b_f').value,to:a?'':$('#b_t').value,note:$('#b_n').value});save()});
  on('w_add',()=>{const f=$('#w_f').value,t=$('#w_t').value;if(!f||!t||t<=f)return;V.weekly.push({id:uid(),wd:+$('#w_wd').value,from:f,to:t,note:''});save()});
  on('s_add',()=>{V.services.push({id:'',cat:'',name:'טיפול חדש',min:30,price:null,on:false});mark();render()});
}
function alertBox(t){const d=document.createElement('div');d.className='box bad';d.textContent=t;app.prepend(d);setTimeout(()=>d.remove(),5000)}
async function save(){
  const b=$('#save');b.disabled=true;$('#dirty').textContent='שומרת…';$('#bar').hidden=false;
  try{const j=await call({mode:'admin_save',value:V});V=j.value;D.value=V;dirty=false;$('#dirty').textContent='נשמר ✓';setTimeout(()=>{if(!dirty)$('#bar').hidden=true},1500);render()}
  catch(e){$('#dirty').textContent='השמירה נכשלה. נסי שוב.'}
  b.disabled=false;
}
$('#save').onclick=save;
async function load(keep){
  try{D=await call({mode:'admin_get'});if(!keep||!dirty)V=JSON.parse(JSON.stringify(D.value));render()}
  catch(e){app.innerHTML=`<div class="center"><h2>${e.message==='forbidden'?'אין גישה':'לא הצלחנו לטעון'}</h2><p class="muted">${e.message==='forbidden'?'צריך להיכנס דרך הקישור האישי שקיבלת מקרין.':'בדקי את החיבור ונסי שוב.'}</p></div>`}
}
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
if(!T){app.innerHTML=`<div class="card" style="margin-top:20px"><h2>כניסה למסך הניהול</h2><p class="h">הדביקי כאן את הקישור האישי שקיבלת מקרין (פעם אחת בלבד במכשיר הזה).</p><input type="text" class="w" id="klink" dir="ltr" placeholder="https://glow.goldchain-ai.com/admin.html#k=…"><button class="btn full" id="kgo" style="margin-top:12px">כניסה</button></div>`;$('#kgo').onclick=()=>{const m=/k=([a-f0-9]{32,})/.exec($('#klink').value);if(!m){alertBox('זה לא הקישור הנכון');return}try{localStorage.setItem('glow_admin',m[1])}catch(e){}T=m[1];history.replaceState(null,'',location.pathname+'#k='+m[1]);load()}}
else load();
</script>
</body>
</html>
